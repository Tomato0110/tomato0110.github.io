<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="収入と支出を月ごとに記録し、カテゴリ別の内訳と過去12か月の推移を確認できる家計簿アプリです。" />
    <meta name="theme-color" content="#1e7d4f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="お金管理" />
    <link rel="icon" href="data:," />
    <title>お金管理アプリ クラウド版</title>
    <style>
      /* Hallmark · redesign: full · scope: app · brand kept: deep green #1e7d4f */
      /* Hallmark · critique: the old design leaked colour and font literals outside its tokens, sat spacing off the 4px scale, and borrowed a stock slate swatch for transfers */
      /* Hallmark · pre-emit critique: P4 H5 E4 S5 R5 V4 · weakest: V, an app screen keeps its owner's layout habits; recomposed as a ruled ledger instead of stacked shadow cards */
      :root {
        color-scheme: light dark;
        --font-body: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
        --bg: oklch(0.965 0.012 145);
        --surface: oklch(0.995 0.004 145);
        --surface-2: oklch(0.945 0.016 145);
        --ink: oklch(0.235 0.025 155);
        --ink-2: oklch(0.44 0.03 155);
        --line: oklch(0.87 0.02 145);
        --line-strong: oklch(0.72 0.035 150);
        --accent: oklch(0.52 0.13 158);
        --accent-strong: oklch(0.44 0.12 158);
        --accent-ink: oklch(0.99 0.006 150);
        --accent-soft: oklch(0.93 0.045 155);
        --accent-disabled: oklch(0.88 0.02 150);
        --accent-disabled-ink: oklch(0.4 0.035 155);
        --income: oklch(0.5 0.13 158);
        --expense: oklch(0.48 0.16 28);
        --expense-soft: oklch(0.94 0.035 28);
        --transfer: oklch(0.5 0.055 208);
        --transfer-soft: oklch(0.93 0.02 208);
        --danger: oklch(0.4 0.15 28);
        --danger-bg: oklch(0.38 0.145 28);
        --danger-ink: oklch(0.99 0.006 30);
        --focus: oklch(0.45 0.14 158);
        --overlay: oklch(0.2 0.02 155 / 0.55);
        --shadow: 0 1px 2px oklch(0.3 0.04 155 / 0.1);
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-7: 28px;
        --space-8: 32px;
        --space-12: 48px;
        --radius-s: 6px;
        --radius-m: 10px;
        --radius-pill: 999px;
        --measure: 560px;
        --text-caption: 12px;
        --text-small: 13px;
        --text-body: 15px;
        --text-lead: 16px;
        --text-title: 19px;
        --text-display: 24px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.17 0.014 150);
          --surface: oklch(0.215 0.016 150);
          --surface-2: oklch(0.26 0.018 150);
          --ink: oklch(0.92 0.012 150);
          --ink-2: oklch(0.72 0.02 150);
          --line: oklch(0.32 0.02 150);
          --line-strong: oklch(0.48 0.03 150);
          --accent: oklch(0.68 0.13 158);
          --accent-strong: oklch(0.74 0.12 158);
          --accent-ink: oklch(0.16 0.03 155);
          --accent-soft: oklch(0.28 0.05 155);
          --accent-disabled: oklch(0.3 0.02 150);
          --accent-disabled-ink: oklch(0.8 0.015 150);
          --income: oklch(0.74 0.13 158);
          --expense: oklch(0.72 0.13 30);
          --expense-soft: oklch(0.28 0.045 28);
          --transfer: oklch(0.74 0.05 208);
          --transfer-soft: oklch(0.28 0.025 208);
          --danger: oklch(0.78 0.11 30);
          --danger-bg: oklch(0.32 0.12 28);
          --danger-ink: oklch(0.97 0.01 30);
          --focus: oklch(0.78 0.13 158);
          --overlay: oklch(0.08 0.01 150 / 0.65);
          --shadow: 0 1px 2px oklch(0.05 0.01 150 / 0.45);
        }
      }
      * { box-sizing: border-box; }
      html {
        -webkit-text-size-adjust: 100%;
        overflow-x: clip;
        scrollbar-color: var(--line-strong) var(--bg);
      }
      body {
        margin: 0;
        overflow-x: clip;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: var(--text-body);
        line-height: 1.55;
        caret-color: var(--accent);
      }
      ::selection { background: var(--accent-soft); color: var(--ink); }
      .num { font-variant-numeric: tabular-nums; }
      .wrap {
        max-width: var(--measure);
        margin: 0 auto;
        padding: var(--space-4) var(--space-4) var(--space-12);
      }
      button { font: inherit; cursor: pointer; }
      input, select, textarea { font: inherit; color: var(--ink); }
      [hidden] { display: none !important; }
      h1, h2, h3 { text-wrap: balance; overflow-wrap: break-word; min-width: 0; }

      /* ---------- 状態（8 states の土台） ---------- */
      button:hover { border-color: var(--line-strong); }
      button:active { transform: translateY(1px); }
      button:disabled { cursor: not-allowed; transform: none; }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      input:hover, select:hover, textarea:hover { border-color: var(--line-strong); }
      input:active, select:active, textarea:active { border-color: var(--line-strong); }
      input:disabled, select:disabled, textarea:disabled {
        background: var(--surface-2);
        color: var(--ink-2);
        cursor: not-allowed;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
        button:active { transform: none; }
      }

      /* ---------- サインイン ---------- */
      .signin-card {
        background: var(--surface); color: var(--ink);
        border: 1px solid var(--line);
        border-top: 4px solid var(--accent);
        border-radius: var(--radius-m);
        box-shadow: var(--shadow);
        padding: var(--space-7) var(--space-6) var(--space-6);
        margin-top: var(--space-12);
      }
      .signin-mark {
        width: var(--space-12); height: var(--space-12);
        border-radius: var(--radius-m);
        background: var(--accent); color: var(--accent-ink);
        display: flex; align-items: center; justify-content: center;
        font-size: var(--text-display); font-weight: 700;
        margin-bottom: var(--space-4);
      }
      .signin-card h1 { font-size: var(--text-title); margin: 0 0 var(--space-1); line-height: 1.35; }
      .signin-card p.sub { margin: 0 0 var(--space-5); color: var(--ink-2); font-size: var(--text-small); }
      .signin-card p.sub-tight { margin-top: calc(var(--space-3) * -1); }
      .signin-card p.sub-foot { margin: var(--space-4) 0 0; }
      .field { margin-bottom: var(--space-4); }
      .field label { display: block; font-size: var(--text-small); font-weight: 600; margin-bottom: var(--space-2); }
      .field input, .field select, .field textarea {
        width: 100%;
        padding: var(--space-3);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-s);
      }
      .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
      .field textarea { resize: vertical; min-height: var(--space-12); }
      .btn-primary {
        width: 100%;
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--accent);
        border-radius: var(--radius-s);
        background: var(--accent); color: var(--accent-ink);
        font-weight: 700; font-size: var(--text-lead);
        transition: background-color 120ms ease-out, border-color 120ms ease-out;
      }
      .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
      .btn-primary:active { background: var(--accent-strong); border-color: var(--accent-strong); }
      .btn-primary:disabled {
        background: var(--accent-disabled);
        border-color: var(--accent-disabled);
        color: var(--accent-disabled-ink);
        cursor: not-allowed;
      }
      .form-error {
        background: var(--expense-soft); color: var(--danger);
        border-radius: var(--radius-s);
        padding: var(--space-3);
        font-size: var(--text-small);
        margin-bottom: var(--space-4);
      }

      /* ---------- アプリ画面 ---------- */
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: var(--space-3); margin-bottom: var(--space-4);
      }
      .topbar .who {
        font-size: var(--text-caption); color: var(--ink-2);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .btn-ghost {
        background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
        border-radius: var(--radius-pill);
        padding: var(--space-2) var(--space-4);
        font-size: var(--text-small); flex: none;
        transition: background-color 120ms ease-out, border-color 120ms ease-out;
      }
      .btn-ghost:hover { background: var(--surface-2); }
      .btn-ghost:active { background: var(--surface-2); }
      .btn-ghost:disabled { color: var(--ink-2); background: var(--surface-2); cursor: not-allowed; }
      .card {
        background: var(--surface); color: var(--ink);
        border-top: 1px solid var(--line-strong);
        padding: var(--space-5) 0 var(--space-6);
        margin-bottom: var(--space-4);
      }
      .card h2 { font-size: var(--text-body); margin: 0 0 var(--space-3); font-weight: 700; }

      .month-nav {
        display: flex; align-items: center; justify-content: space-between;
        gap: var(--space-3); margin-bottom: var(--space-4);
      }
      .month-nav .m-label { font-size: var(--text-title); font-weight: 700; }
      .month-nav button {
        min-height: var(--space-8);
        border-radius: var(--radius-pill);
        border: 1px solid var(--line);
        background: var(--surface); color: var(--ink);
        padding: var(--space-2) var(--space-4);
        font-size: var(--text-small); font-weight: 600; line-height: 1;
        box-shadow: var(--shadow);
        white-space: nowrap;
        transition: background-color 120ms ease-out, border-color 120ms ease-out;
      }
      .month-nav button:hover { background: var(--surface-2); }
      .month-nav button:active { background: var(--surface-2); }
      .month-nav button:disabled { color: var(--ink-2); background: var(--surface-2); cursor: not-allowed; box-shadow: none; }
      .summary-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-3) var(--space-4); }
      .summary-grid .cell .k { font-size: var(--text-caption); color: var(--ink-2); }
      .summary-grid .cell .v { font-size: var(--text-title); font-weight: 700; }
      .summary-grid .cell.balance { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: var(--space-3); }
      .summary-grid .cell.balance .v { font-size: var(--text-display); }
      .v.income { color: var(--income); }
      .v.expense { color: var(--expense); }
      .v.neg { color: var(--expense); }

      .seg {
        display: flex; background: var(--surface-2);
        border-radius: var(--radius-pill);
        padding: var(--space-1); gap: var(--space-1);
      }
      .seg-spaced { margin-bottom: var(--space-4); }
      .seg button {
        flex: 1; border: 1px solid transparent; background: none;
        border-radius: var(--radius-pill);
        padding: var(--space-2) var(--space-1);
        font-size: var(--text-small); color: var(--ink-2); font-weight: 600;
        white-space: nowrap;
        transition: background-color 120ms ease-out, color 120ms ease-out;
      }
      .seg button:hover { color: var(--ink); }
      .seg button:active { color: var(--ink); }
      .seg button:disabled { color: var(--ink-2); cursor: not-allowed; }
      .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
      .donut-flex { display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap; }
      .donut-box { flex: none; margin: 0 auto; }
      .legend { flex: 1 1 180px; min-width: 0; }
      .legend .row {
        display: flex; align-items: baseline; gap: var(--space-2);
        padding: var(--space-1) 0;
        border-bottom: 1px dashed var(--line);
        font-size: var(--text-small);
      }
      .legend .row:last-child { border-bottom: none; }
      .legend .dot {
        width: var(--space-3); height: var(--space-3);
        border-radius: var(--radius-s); flex: none; align-self: center;
      }
      .legend .name { flex: 1; }
      .legend .pct { color: var(--ink-2); font-size: var(--text-caption); }
      .legend .amt { font-weight: 600; }
      .empty-note { color: var(--ink-2); font-size: var(--text-small); text-align: center; padding: var(--space-4) 0 var(--space-2); }

      .trend-wrap { overflow: hidden; }
      .trend-legend { display: flex; gap: var(--space-4); font-size: var(--text-caption); color: var(--ink-2); margin-bottom: var(--space-2); }
      .trend-legend .dot { display: inline-block; width: var(--space-3); height: var(--space-3); border-radius: var(--radius-s); margin-right: var(--space-1); vertical-align: -1px; }
      .trend-legend .dot-income { background: var(--income); }
      .trend-legend .dot-expense { background: var(--expense); }

      /* フォーム */
      .kind-seg { margin-bottom: var(--space-4); }
      .form-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 var(--space-3); }
      .form-grid .full { grid-column: 1 / -1; }
      .form-actions { display: flex; gap: var(--space-3); margin-top: var(--space-1); }
      .form-actions .btn-primary { flex: 1; width: auto; }
      .btn-cancel {
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-s);
        border: 1px solid var(--line);
        background: var(--surface); color: var(--ink-2); font-weight: 600;
        transition: background-color 120ms ease-out, border-color 120ms ease-out;
      }
      .btn-cancel:hover { background: var(--surface-2); }
      .btn-cancel:active { background: var(--surface-2); }
      .btn-cancel:disabled { background: var(--surface-2); color: var(--ink-2); cursor: not-allowed; }
      .editing-banner {
        background: var(--accent-soft); color: var(--accent-strong);
        border-radius: var(--radius-s);
        padding: var(--space-2) var(--space-3);
        font-size: var(--text-small); font-weight: 600;
        margin-bottom: var(--space-4);
      }

      /* 一覧 */
      .tx-list { list-style: none; margin: 0; padding: 0; }
      .tx-item {
        display: flex; gap: var(--space-3);
        padding: var(--space-3) 0;
        border-bottom: 1px solid var(--line);
        align-items: flex-start;
      }
      .tx-item:last-child { border-bottom: none; }
      .tx-date { flex: none; width: var(--space-12); text-align: center; }
      .tx-date .d { font-size: var(--text-lead); font-weight: 700; line-height: 1.2; }
      .tx-date .w { font-size: var(--text-caption); color: var(--ink-2); }
      .tx-main { flex: 1; min-width: 0; }
      .tx-title { font-weight: 600; font-size: var(--text-body); overflow-wrap: anywhere; }
      .tx-meta { font-size: var(--text-caption); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); align-items: center; }
      .chip {
        display: inline-block;
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-pill);
        font-size: var(--text-caption); font-weight: 600;
        background: var(--surface-2); color: var(--ink-2);
      }
      .chip.expense { background: var(--expense-soft); color: var(--expense); }
      .chip.income { background: var(--accent-soft); color: var(--income); }
      .chip.transfer { background: var(--transfer-soft); color: var(--transfer); }
      .tx-note { font-size: var(--text-caption); color: var(--ink-2); overflow-wrap: anywhere; }
      .tx-right { flex: none; text-align: right; }
      .tx-amount { font-size: var(--text-lead); font-weight: 700; }
      .tx-amount.expense { color: var(--expense); }
      .tx-amount.income { color: var(--income); }
      .tx-amount.transfer { color: var(--transfer); }
      .tx-tools { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-1); }
      .tx-tools button {
        border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
        border-radius: var(--radius-s);
        padding: var(--space-1) var(--space-3);
        font-size: var(--text-caption);
        transition: background-color 120ms ease-out, border-color 120ms ease-out;
      }
      .tx-tools button:hover { background: var(--surface-2); color: var(--ink); }
      .tx-tools button:active { background: var(--surface-2); color: var(--ink); }
      .tx-tools button:disabled { background: var(--surface-2); cursor: not-allowed; }
      .tx-tools button.del { color: var(--danger); }
      .tx-tools button.del:hover { color: var(--danger); }

      .banner {
        border-radius: var(--radius-s);
        padding: var(--space-3);
        font-size: var(--text-small);
        margin-bottom: var(--space-4);
      }
      .banner.err { background: var(--expense-soft); color: var(--danger); }
      .banner.ok { background: var(--accent-soft); color: var(--accent-strong); }
      .loading { text-align: center; color: var(--ink-2); padding: var(--space-6) 0; font-size: var(--text-body); }

      /* 削除モーダル */
      .modal-back {
        position: fixed; inset: 0; background: var(--overlay);
        display: flex; align-items: center; justify-content: center;
        padding: var(--space-5); z-index: 50;
      }
      .modal {
        background: var(--surface);
        border-radius: var(--radius-m);
        padding: var(--space-6);
        max-width: 380px; width: 100%;
        box-shadow: var(--shadow);
      }
      .modal h3 { margin: 0 0 var(--space-2); font-size: var(--text-lead); }
      .modal p { margin: 0 0 var(--space-4); color: var(--ink-2); font-size: var(--text-body); overflow-wrap: anywhere; }
      .modal .row { display: flex; gap: var(--space-3); }
      .modal .row button {
        flex: 1;
        padding: var(--space-3);
        border-radius: var(--radius-s);
        font-weight: 700;
        transition: background-color 120ms ease-out, border-color 120ms ease-out, opacity 120ms ease-out;
      }
      .btn-danger { background: var(--danger-bg); color: var(--danger-ink); border: 1px solid var(--danger-bg); }
      .btn-danger:hover { opacity: 0.92; }
      .btn-danger:active { opacity: 0.85; }
      .btn-danger:disabled { opacity: 0.6; color: var(--danger-ink); cursor: not-allowed; }
      .btn-plain { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
      .btn-plain:hover { background: var(--surface-2); }
      .btn-plain:active { background: var(--surface-2); }
      .btn-plain:disabled { background: var(--surface-2); color: var(--ink-2); cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="wrap">

      <!-- サインイン -->
      <section id="view-signin" hidden>
        <div class="signin-card">
          <div class="signin-mark">¥</div>
          <h1>お金管理</h1>
          <p class="sub">サインインして家計簿を開きます。</p>
          <div class="form-error" id="signin-error" hidden></div>
          <form id="signin-form" autocomplete="on">
            <div class="field">
              <label for="si-email">メールアドレス</label>
              <input id="si-email" type="email" name="email" autocomplete="email" required inputmode="email" />
            </div>
            <div class="field">
              <label for="si-password">パスワード</label>
              <input id="si-password" type="password" name="password" autocomplete="current-password" required />
            </div>
            <button class="btn-primary" id="signin-btn" type="submit">サインイン</button>
          </form>
        </div>
      </section>

      <!-- パスワード設定（招待 / 再設定リンクから着地） -->
      <section id="view-setpw" hidden>
        <div class="signin-card">
          <div class="signin-mark">¥</div>
          <h1>パスワードを設定してください</h1>
          <p class="sub" id="setpw-sub">招待（またはパスワード再設定）のリンクから開きました。アプリで使うパスワードを決めてください。</p>
          <p class="sub sub-tight num" id="setpw-email" hidden></p>
          <div class="form-error" id="setpw-error" hidden></div>
          <form id="setpw-form" autocomplete="on">
            <div class="field">
              <label for="setpw-password">新しいパスワード</label>
              <input id="setpw-password" type="password" name="new-password" autocomplete="new-password" required minlength="6" />
            </div>
            <div class="field">
              <label for="setpw-confirm">新しいパスワード（確認）</label>
              <input id="setpw-confirm" type="password" name="new-password-confirm" autocomplete="new-password" required minlength="6" />
            </div>
            <button class="btn-primary" id="setpw-btn" type="submit">パスワードを設定する</button>
          </form>
          <p class="sub sub-foot">6文字以上で、ほかのサービスで使い回していないパスワードにしてください。</p>
        </div>
      </section>

      <!-- 家計簿 -->
      <section id="view-app" hidden>
        <div class="topbar">
          <span class="who num" id="user-email"></span>
          <button class="btn-ghost" id="signout-btn" type="button">サインアウト</button>
        </div>

        <div class="banner err" id="app-error" hidden></div>
        <div class="banner ok" id="app-ok" hidden></div>

        <div class="month-nav">
          <button id="prev-month" type="button" aria-label="前月">前月</button>

          <h2>過去12か月の推移</h2>

            <span><span class="dot dot-income"></span>収入</span>

    <!-- 削除確認 -->
    <div class="modal-back" id="delete-modal" hidden>
      <div class="modal" role="alertdialog" aria-labelledby="del-title">
        <h3 id="del-title">この取引を削除しますか？</h3>

    <script>
      "use strict";

      /* ================= 接続情報 ================= */
      var SUPABASE_URL = "https://piwdjqobechdgqcxtbmb.supabase.co";
      var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpd2RqcW9iZWNoZGdxY3h0Ym1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzY5NDcsImV4cCI6MjEwOTU1Mjk0N30.ZUEcho3As2Ny1xEsifs3sPpHg7N0ZgHJeiosH52ZjAk";

      var LS_ACCESS = "moneyapp.access_token";
      var LS_REFRESH = "moneyapp.refresh_token";
      var LS_EXPIRES = "moneyapp.expires_at";
      var LS_EMAIL = "moneyapp.email";

      /* ================= カテゴリ ================= */
      var CATEGORIES = {
        expense: ["食費", "交通費", "日用品", "住まい", "光熱費・水道", "通信費", "医療・健康", "娯楽", "服・美容", "教育", "交際費", "その他"],
        income: ["給料", "お小遣い", "ポイント・還元", "その他収入"],
        transfer: ["資金移動"]
      };
      var KIND_LABEL = { expense: "支出", income: "収入", transfer: "資金移動" };
      var PALETTE = ["#1e7d4f", "#e8a13a", "#4a7fb5", "#d4503c", "#7a5fa8", "#3aa6a0", "#c96a9b", "#8a9a3b", "#5b7fa6", "#b5713a", "#6b8f71", "#96714a", "#7d8590", "#4f6f8f"];
      var WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

      /* ================= 状態 ================= */
      var state = {
        txs: [],
        viewYear: 0, viewMonth: 0,          // 表示中の月 (month は 1-12)
        donutKind: "expense",
        formKind: "expense",
        editingId: null,
        deleteTarget: null,
        refreshTimer: null
      };

      /* ================= ユーティリティ ================= */
      function $(id) { return document.getElementById(id); }
      function pad2(n) { return (n < 10 ? "0" : "") + n; }
      function yen(n) {
        var sign = n < 0 ? "−" : "";
        return sign + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
      }
      function monthKey(y, m) { return y + "-" + pad2(m); }
      function todayStr() {
        var d = new Date();
        return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      /* ================= 認証 ================= */
      function getAccess() { return localStorage.getItem(LS_ACCESS) || ""; }
      function getRefresh() { return localStorage.getItem(LS_REFRESH) || ""; }
      function getExpires() { return parseInt(localStorage.getItem(LS_EXPIRES) || "0", 10); }

      function saveSession(data) {
        localStorage.setItem(LS_ACCESS, data.access_token);
        if (data.refresh_token) localStorage.setItem(LS_REFRESH, data.refresh_token);
        var expiresAt = Date.now() + (data.expires_in ? data.expires_in * 1000 : 3600 * 1000);
        localStorage.setItem(LS_EXPIRES, String(expiresAt));
        if (data.user && data.user.email) localStorage.setItem(LS_EMAIL, data.user.email);
        scheduleRefresh(expiresAt);
      }
      function clearSession() {
        localStorage.removeItem(LS_ACCESS);
        localStorage.removeItem(LS_REFRESH);
        localStorage.removeItem(LS_EXPIRES);
        localStorage.removeItem(LS_EMAIL);
        if (state.refreshTimer) { clearTimeout(state.refreshTimer); state.refreshTimer = null; }
      }
      function scheduleRefresh(expiresAt) {
        if (state.refreshTimer) clearTimeout(state.refreshTimer);
        var delay = expiresAt - Date.now() - 60 * 1000; // 期限の60秒前に更新
        if (delay < 5000) delay = 5000;
        state.refreshTimer = setTimeout(function () {
          refreshSession().catch(function () { /* 失敗時は次のリクエストで再試行 */ });
        }, delay);
      }

      function authRequest(grantQuery, body) {
        return fetch(SUPABASE_URL + "/auth/v1/token?" + grantQuery, {
          method: "POST",
          headers: { "apikey": ANON_KEY, "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (json) {
            if (!res.ok) {
              var msg = json.error_description || json.msg || json.message || ("HTTP " + res.status);
              throw new Error(msg);
            }
            return json;
          });
        });
      }

      function signIn(email, password) {
        return authRequest("grant_type=password", { email: email, password: password })
          .then(function (data) { saveSession(data); return data; });
      }

      var refreshPromise = null;
      function refreshSession() {
        if (refreshPromise) return refreshPromise;
        var rt = getRefresh();
        if (!rt) return Promise.reject(new Error("no refresh token"));
        refreshPromise = authRequest("grant_type=refresh_token", { refresh_token: rt })
          .then(function (data) { saveSession(data); refreshPromise = null; return data; })
          .catch(function (err) { refreshPromise = null; throw err; });
        return refreshPromise;
      }

      function signOut() {
        var token = getAccess();
        clearSession();
        if (token) {
          fetch(SUPABASE_URL + "/auth/v1/logout", {
            method: "POST",
            headers: { "apikey": ANON_KEY, "Authorization": "Bearer " + token }
          }).catch(function () {});
        }
        showSignin();
      }

      /* ---------- 認証コールバック（招待 / パスワード再設定） ---------- */
      // Supabase の招待・再設定メールは
      //   #access_token=...&refresh_token=...&expires_in=3600&token_type=bearer&type=invite
      //   （または type=recovery）
      // というハッシュ付きでこのページに着地する。そのセッションを受け取り、
      // パスワード設定フォームへ進める。
      function parseHashParams() {
        var hash = window.location.hash || "";
        if (hash.charAt(0) === "#") hash = hash.slice(1);
        if (!hash) return null;
        try {
          var params = new URLSearchParams(hash);
          var out = {};
          var has = false;
          params.forEach(function (v, k) { out[k] = v; has = true; });
          return has ? out : null;
        } catch (e) {
          return null;
        }
      }

      function clearUrlHash() {
        try {
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, document.title,
              window.location.pathname + window.location.search);
          } else {
            window.location.hash = "";
          }
        } catch (e) { /* ハッシュ除去はベストエフォート */ }
      }

      function fetchCurrentUser(token) {
        return fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "GET",
          headers: { "apikey": ANON_KEY, "Authorization": "Bearer " + token }
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (json) {
            if (!res.ok) {
              var msg = json.error_description || json.msg || json.message || ("HTTP " + res.status);
              throw new Error(msg);
            }
            return json;
          });
        });
      }

      function updatePassword(newPassword) {
        var token = getAccess();
        if (!token) return Promise.reject(new Error("セッションがありません。リンクをもう一度開いてください。"));
        return fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "apikey": ANON_KEY,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ password: newPassword })
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (json) {
            if (!res.ok) {
              var msg = json.error_description || json.msg || json.message || ("HTTP " + res.status);
              throw new Error(msg);
            }
            if (json && json.email) localStorage.setItem(LS_EMAIL, json.email);
            return json;
          });
        });
      }

      // ハッシュにコールバック情報があれば処理する。
      // 戻り値: "setpw" = パスワード設定画面を出す / "error" = エラーを表示済み / null = コールバックなし
      var authCallbackType = "";
      function handleAuthCallback() {
        var p = parseHashParams();
        if (!p) return null;
        // エラー付きで戻ってきた場合（リンク期限切れ等）
        if (p.error || p.error_description) {
          clearUrlHash();
          var desc = p.error_description || p.error || "";
          try { desc = decodeURIComponent(String(desc).replace(/\+/g, " ")); } catch (e) {}
          showSignin("リンクを開けませんでした：" + desc + "　新しい招待／再設定メールから開き直してください。");
          return "error";
        }
        var type = p.type || "";
        var isPasswordFlow = (type === "invite" || type === "recovery");
        if (!p.access_token) return null;
        if (!isPasswordFlow) {
          // signup / magiclink 等、パスワード設定が不要なコールバックは
          // セッションだけ受け取って通常画面へ進む
          var exp2 = parseInt(p.expires_in || "3600", 10);
          if (isNaN(exp2) || exp2 <= 0) exp2 = 3600;
          saveSession({
            access_token: p.access_token,
            refresh_token: p.refresh_token || "",
            expires_in: exp2,
            user: null
          });
          clearUrlHash();
          fetchCurrentUser(p.access_token).then(function (user) {
            if (user && user.email) localStorage.setItem(LS_EMAIL, user.email);
            showApp();
            loadData();
          }).catch(function () {
            showApp();
            loadData();
          });
          return "session";
        }
        authCallbackType = type;
        var expiresIn = parseInt(p.expires_in || "3600", 10);
        if (isNaN(expiresIn) || expiresIn <= 0) expiresIn = 3600;
        saveSession({
          access_token: p.access_token,
          refresh_token: p.refresh_token || "",
          expires_in: expiresIn,
          user: null
        });
        // トークンをアドレスバーに残さない
        clearUrlHash();
        showSetPassword();
        // メールアドレス表示用にユーザー情報を取得（失敗してもフォームは使える）
        fetchCurrentUser(p.access_token).then(function (user) {
          if (user && user.email) {
            localStorage.setItem(LS_EMAIL, user.email);
            var el = $("setpw-email");
            if (el) { el.textContent = user.email; el.hidden = false; }
          }
        }).catch(function () { /* 表示だけの取得なので無視 */ });
        return "setpw";
      }

      /* ================= REST ================= */
      function restFetch(path, options, retried) {
        options = options || {};
        var headers = {
          "apikey": ANON_KEY,
          "Authorization": "Bearer " + getAccess(),
          "Content-Type": "application/json"
        };
        if (options.headers) {
          for (var k in options.headers) headers[k] = options.headers[k];
        }
        var init = { method: options.method || "GET", headers: headers };
        if (options.body != null) init.body = JSON.stringify(options.body);
        return fetch(SUPABASE_URL + path, init).then(function (res) {
          if (res.status === 401 && !retried) {
            return refreshSession().then(function () {
              return restFetch(path, options, true);
            }).catch(function () {
              clearSession(); showSignin("セッションの有効期限が切れました。もう一度サインインしてください。");
              throw new Error("unauthorized");
            });
          }
          if (res.status === 204) return null;
          return res.json().catch(function () { return null; }).then(function (json) {
            if (!res.ok) {
              var msg = (json && (json.message || json.hint || json.details)) || ("HTTP " + res.status);
              throw new Error(msg);
            }
            return json;
          });
        });
      }

      function fetchTransactions() {
        return restFetch("/rest/v1/transactions?select=*&order=date.desc,created_at.desc");
      }

      /* ================= 画面切替 ================= */
      function showSignin(msg) {
        $("view-app").hidden = true;
        $("view-setpw").hidden = true;
        $("view-signin").hidden = false;
        var err = $("signin-error");
        if (msg) { err.textContent = msg; err.hidden = false; } else { err.hidden = true; }
      }
      function showSetPassword() {
        $("view-signin").hidden = true;
        $("view-app").hidden = true;
        $("view-setpw").hidden = false;
        var sub = $("setpw-sub");
        if (sub) {
          sub.textContent = authCallbackType === "recovery"
            ? "パスワード再設定のリンクから開きました。新しいパスワードを決めてください。"
            : "招待のリンクから開きました。アプリで使うパスワードを決めてください。";
        }
        var email = localStorage.getItem(LS_EMAIL) || "";
        var emailEl = $("setpw-email");
        if (emailEl) {
          if (email) { emailEl.textContent = email; emailEl.hidden = false; }
          else { emailEl.hidden = true; }
        }
        var pw = $("setpw-password");
        if (pw) { setTimeout(function () { try { pw.focus(); } catch (e) {} }, 50); }
      }
      function showApp() {
        $("view-signin").hidden = true;
        $("view-setpw").hidden = true;
        $("view-app").hidden = false;
        $("user-email").textContent = localStorage.getItem(LS_EMAIL) || "";
      }
      function showAppError(msg) {
        var el = $("app-error");
        if (msg) { el.textContent = msg; el.hidden = false; } else { el.hidden = true; }
      }
      function showAppOk(msg) {
        var el = $("app-ok");
        el.textContent = msg; el.hidden = false;
        setTimeout(function () { el.hidden = true; }, 2600);
      }

      /* ================= 描画 ================= */
      function currentMonthTxs() {
        var key = monthKey(state.viewYear, state.viewMonth);
        return state.txs.filter(function (t) { return (t.date || "").slice(0, 7) === key; });
      }

      function render() {
        $("month-label").textContent = state.viewYear + "年" + state.viewMonth + "月";
        var txs = currentMonthTxs();
        var income = 0, expense = 0;
        txs.forEach(function (t) {
          if (t.kind === "income") income += Number(t.amount) || 0;
          else if (t.kind === "expense") expense += Number(t.amount) || 0;
        });
        $("sum-income").textContent = yen(income);
        $("sum-expense").textContent = yen(expense);
        var bal = income - expense;
        var balEl = $("sum-balance");
        balEl.textContent = yen(bal);
        balEl.className = "v num" + (bal < 0 ? " neg" : "");
        renderDonut(txs);
        renderList(txs);
        renderTrend();
      }

      function renderDonut(txs) {
        $("donut-expense").classList.toggle("on", state.donutKind === "expense");
        $("donut-income").classList.toggle("on", state.donutKind === "income");
        var byCat = {};
        var total = 0;
        txs.forEach(function (t) {
          if (t.kind !== state.donutKind) return;
          var c = t.category || "その他";
          byCat[c] = (byCat[c] || 0) + (Number(t.amount) || 0);
          total += Number(t.amount) || 0;
        });
        var area = $("donut-area");
        var entries = Object.keys(byCat).map(function (c) { return { name: c, value: byCat[c] }; })
          .sort(function (a, b) { return b.value - a.value; });
        if (!entries.length || total <= 0) {
          area.innerHTML = '<div class="empty-note">この月の' + KIND_LABEL[state.donutKind] + 'はまだありません。</div>';
          return;
        }
        var size = 168, r = 62, cx = size / 2, cy = size / 2, sw = 30;
        var circ = 2 * Math.PI * r;
        var offset = 0;
        var segs = "";
        entries.forEach(function (e, i) {
          var frac = e.value / total;
          var len = Math.max(frac * circ - 2, 0.5);
          segs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' +
            PALETTE[i % PALETTE.length] + '" stroke-width="' + sw + '" stroke-dasharray="' +
            len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' +
            (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' +
            esc(e.name) + ' ' + yen(e.value) + '</title></circle>';
          offset += frac * circ;
        });
        var svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="カテゴリ別ドーナツグラフ">' +
          segs +
          '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="12" fill="var(--ink-2)">' + KIND_LABEL[state.donutKind] + '合計</text>' +
          '<text x="' + cx + '" y="' + (cy + 17) + '" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">' + esc(yen(total)) + '</text></svg>';
        var legend = entries.map(function (e, i) {
          var pct = Math.round(e.value / total * 1000) / 10;
          return '<div class="row"><span class="dot" style="background:' + PALETTE[i % PALETTE.length] + '"></span>' +
            '<span class="name">' + esc(e.name) + '</span>' +
            '<span class="pct num">' + pct + '%</span>' +
            '<span class="num amt">' + esc(yen(e.value)) + '</span></div>';
        }).join("");
        area.innerHTML = '<div class="donut-flex"><div class="donut-box">' + svg + '</div><div class="legend">' + legend + '</div></div>';
      }

      function renderList(txs) {
        var area = $("tx-area");
        if (!txs.length) {
          area.innerHTML = '<div class="empty-note">この月の取引はまだありません。</div>';
          return;
        }
        var html = '<ul class="tx-list">';
        txs.forEach(function (t) {
          var d = new Date(t.date + "T00:00:00");
          var day = isNaN(d.getTime()) ? "" : d.getDate();
          var wd = isNaN(d.getTime()) ? "" : WEEKDAYS[d.getDay()];
          var sign = t.kind === "expense" ? "−" : (t.kind === "income" ? "+" : "");
          var title = t.title || t.category || "";
          var src = t.source && t.source !== "manual"
            ? '<span class="chip">' + esc(t.source) + '</span>' : "";
          html += '<li class="tx-item">' +
            '<div class="tx-date"><div class="d num">' + day + '</div><div class="w">' + wd + '曜</div></div>' +
            '<div class="tx-main"><div class="tx-title">' + esc(title) + '</div>' +
            '<div class="tx-meta"><span class="chip ' + t.kind + '">' + esc(t.category || "") + '</span>' + src + '</div>' +
            (t.note ? '<div class="tx-note">' + esc(t.note) + '</div>' : "") +
            '</div>' +
            '<div class="tx-right"><div class="tx-amount num ' + t.kind + '">' + sign + esc(yen(Number(t.amount) || 0)) + '</div>' +
            '<div class="tx-tools"><button type="button" data-edit="' + esc(t.id) + '">編集</button>' +
            '<button type="button" class="del" data-del="' + esc(t.id) + '">削除</button></div></div>' +
            '</li>';
        });
        html += "</ul>";
        area.innerHTML = html;
        area.querySelectorAll("[data-edit]").forEach(function (b) {
          b.addEventListener("click", function () { startEdit(b.getAttribute("data-edit")); });
        });
        area.querySelectorAll("[data-del]").forEach(function (b) {
          b.addEventListener("click", function () { askDelete(b.getAttribute("data-del")); });
        });
      }

      function renderTrend() {
        var now = new Date();
        var months = [];
        for (var i = 11; i >= 0; i--) {
          var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          months.push({ y: d.getFullYear(), m: d.getMonth() + 1, income: 0, expense: 0 });
        }
        state.txs.forEach(function (t) {
          var key = (t.date || "").slice(0, 7);
          for (var j = 0; j < months.length; j++) {
            if (monthKey(months[j].y, months[j].m) === key) {
              if (t.kind === "income") months[j].income += Number(t.amount) || 0;
              else if (t.kind === "expense") months[j].expense += Number(t.amount) || 0;
              break;
            }
          }
        });
        var max = 0;
        months.forEach(function (mo) { max = Math.max(max, mo.income, mo.expense); });
        var area = $("trend-area");
        if (max <= 0) {
          area.innerHTML = '<div class="empty-note">過去12か月のデータはまだありません。</div>';
          return;
        }
        var W = 520, H = 190, base = 158, top = 14;
        var plotH = base - top;
        var groupW = W / 12;
        var barW = Math.min(13, groupW / 2 - 4);
        var parts = "";
        // 目盛り（最大値）
        parts += '<text x="0" y="' + (top + 4) + '" font-size="10" fill="var(--ink-2)">' + esc(yen(max)) + '</text>';
        parts += '<line x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '" stroke="var(--line)" stroke-width="1"/>';
        months.forEach(function (mo, idx) {
          var gx = idx * groupW + groupW / 2;
          var ih = mo.income / max * plotH;
          var eh = mo.expense / max * plotH;
          if (mo.income > 0) {
            parts += '<rect x="' + (gx - barW - 1.5).toFixed(1) + '" y="' + (base - ih).toFixed(1) + '" width="' + barW + '" height="' + ih.toFixed(1) + '" rx="2" fill="var(--income)"><title>' +
              mo.y + '年' + mo.m + '月 収入 ' + yen(mo.income) + '</title></rect>';
          }
          if (mo.expense > 0) {
            parts += '<rect x="' + (gx + 1.5).toFixed(1) + '" y="' + (base - eh).toFixed(1) + '" width="' + barW + '" height="' + eh.toFixed(1) + '" rx="2" fill="var(--expense)"><title>' +
              mo.y + '年' + mo.m + '月 支出 ' + yen(mo.expense) + '</title></rect>';
          }
          var isView = (mo.y === state.viewYear && mo.m === state.viewMonth);
          parts += '<text x="' + gx + '" y="' + (base + 16) + '" text-anchor="middle" font-size="10.5" ' +
            (isView ? 'font-weight="700" fill="var(--ink)"' : 'fill="var(--ink-2)"') + '>' + mo.m + '月</text>';
          if (mo.m === 1) {
            parts += '<text x="' + gx + '" y="' + (base + 30) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-2)">' + mo.y + '</text>';
          }
        });
        area.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="過去12か月の収入と支出の推移グラフ">' + parts + '</svg>';
      }

      /* ================= データ読み込み ================= */
      function loadData() {
        showAppError("");
        return fetchTransactions().then(function (rows) {
          state.txs = Array.isArray(rows) ? rows : [];
          render();
        }).catch(function (err) {
          if (err && err.message === "unauthorized") return;
          showAppError("データの読み込みに失敗しました：" + (err && err.message ? err.message : err));
          $("tx-area").innerHTML = '<div class="empty-note">読み込めませんでした。</div>';
        });
      }

      /* ================= フォーム ================= */
      function setFormKind(kind, keepCategory) {
        state.formKind = kind;
        document.querySelectorAll(".kind-seg button").forEach(function (b) {
          b.classList.toggle("on", b.getAttribute("data-kind") === kind);
        });
        var sel = $("f-category");
        var prev = keepCategory ? sel.value : "";
        sel.innerHTML = "";
        CATEGORIES[kind].forEach(function (c) {
          var opt = document.createElement("option");
          opt.value = c; opt.textContent = c;
          sel.appendChild(opt);
        });
        if (prev && CATEGORIES[kind].indexOf(prev) >= 0) sel.value = prev;
      }

      function resetForm() {
        state.editingId = null;
        $("tx-form").reset();
        $("f-date").value = todayStr();
        setFormKind("expense", false);
        $("form-heading").textContent = "取引を追加";
        $("tx-submit").textContent = "追加する";
        $("tx-cancel").hidden = true;
        $("editing-banner").hidden = true;
        $("form-error").hidden = true;
      }

      function startEdit(id) {
        var t = null;
        state.txs.forEach(function (x) { if (String(x.id) === String(id)) t = x; });
        if (!t) return;
        state.editingId = t.id;
        setFormKind(t.kind || "expense", false);
        if (CATEGORIES[state.formKind].indexOf(t.category) < 0) {
          var opt = document.createElement("option");
          opt.value = t.category; opt.textContent = t.category;
          $("f-category").appendChild(opt);
        }
        $("f-category").value = t.category || "";
        $("f-date").value = t.date || todayStr();
        $("f-amount").value = t.amount != null ? t.amount : "";
        $("f-title").value = t.title || "";
        $("f-note").value = t.note || "";
        $("form-heading").textContent = "取引を編集";
        $("tx-submit").textContent = "保存する";
        $("tx-cancel").hidden = false;
        $("editing-banner").hidden = false;
        $("form-error").hidden = true;
        $("tx-form").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function submitForm(ev) {
        ev.preventDefault();
        var errEl = $("form-error");
        errEl.hidden = true;
        var date = $("f-date").value;
        var amount = parseInt($("f-amount").value, 10);
        var category = $("f-category").value;
        var title = $("f-title").value.trim();
        var note = $("f-note").value.trim();
        if (!date) { errEl.textContent = "日付を入力してください。"; errEl.hidden = false; return; }
        if (!amount || amount <= 0 || Math.floor(amount) !== amount) {
          errEl.textContent = "金額は1円以上の整数で入力してください。"; errEl.hidden = false; return;
        }
        var btn = $("tx-submit");
        btn.disabled = true;
        var done = function () { btn.disabled = false; };
        if (state.editingId != null) {
          restFetch("/rest/v1/transactions?id=eq." + encodeURIComponent(state.editingId), {
            method: "PATCH",
            headers: { "Prefer": "return=representation" },
            body: { date: date, kind: state.formKind, amount: amount, category: category, title: title, note: note }
          }).then(function () {
            done(); resetForm(); showAppOk("取引を更新しました。"); return loadData();
          }).catch(function (err) {
            done();
            errEl.textContent = "保存に失敗しました：" + (err && err.message ? err.message : err);
            errEl.hidden = false;
          });
        } else {
          restFetch("/rest/v1/transactions", {
            method: "POST",
            headers: { "Prefer": "return=representation" },
            body: {
              date: date, kind: state.formKind, amount: amount, category: category,
              title: title, note: note, source: "manual", source_ref: null
            }
          }).then(function () {
            done(); resetForm(); showAppOk("取引を追加しました。"); return loadData();
          }).catch(function (err) {
            done();
            errEl.textContent = "追加に失敗しました：" + (err && err.message ? err.message : err);
            errEl.hidden = false;
          });
        }
      }

      /* ================= 削除 ================= */
      function askDelete(id) {
        var t = null;
        state.txs.forEach(function (x) { if (String(x.id) === String(id)) t = x; });
        if (!t) return;
        state.deleteTarget = t;
        $("del-desc").textContent = t.date + " ・ " + (t.title || t.category || "") + " ・ " +
          KIND_LABEL[t.kind] + " " + yen(Number(t.amount) || 0);
        $("delete-modal").hidden = false;
      }
      function closeDelete() {
        state.deleteTarget = null;
        $("delete-modal").hidden = true;
      }
      function doDelete() {
        var t = state.deleteTarget;
        if (!t) return;
        var btn = $("del-ok");
        btn.disabled = true;
        restFetch("/rest/v1/transactions?id=eq." + encodeURIComponent(t.id), { method: "DELETE" })
          .then(function () {
            btn.disabled = false; closeDelete();
            if (state.editingId != null && String(state.editingId) === String(t.id)) resetForm();
            showAppOk("取引を削除しました。");
            return loadData();
          }).catch(function (err) {
            btn.disabled = false; closeDelete();
            showAppError("削除に失敗しました：" + (err && err.message ? err.message : err));
          });
      }

      /* ================= PWA ================= */
      function setupPWA() {
        try {
          var iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
            '<rect width="512" height="512" rx="96" fill="#1e7d4f"/>' +
            '<text x="256" y="345" font-size="290" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">¥</text></svg>';
          var iconUri = "data:image/svg+xml," + encodeURIComponent(iconSvg);
          var manifest = {
            name: "お金管理",
            short_name: "お金管理",
            start_url: ".",
            scope: ".",
            display: "standalone",
            background_color: "#f4f6f2",
            theme_color: "#1e7d4f",
            icons: [
              { src: iconUri, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
              { src: iconUri, sizes: "512x512", type: "image/svg+xml", purpose: "any" }
            ]
          };
          var blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
          var link = document.createElement("link");
          link.rel = "manifest";
          link.href = URL.createObjectURL(blob);
          document.head.appendChild(link);
          var apple = document.createElement("link");
          apple.rel = "apple-touch-icon";
          apple.href = iconUri;
          document.head.appendChild(apple);
          var fav = document.querySelector('link[rel="icon"]');
          if (fav) fav.href = iconUri;
        } catch (e) { /* PWA はベストエフォート */ }
        try {
          if ("serviceWorker" in navigator) {
            var swCode = [
              "var CACHE = 'money-app-v1';",
              "self.addEventListener('install', function (e) { self.skipWaiting(); });",
              "self.addEventListener('activate', function (e) { e.waitUntil(self.clients.claim()); });",
              "self.addEventListener('fetch', function (e) {",
              "  if (e.request.method !== 'GET') return;",
              "  e.respondWith(fetch(e.request).catch(function () { return caches.match(e.request); }));",
              "});"
            ].join("\n");
            var swUrl = URL.createObjectURL(new Blob([swCode], { type: "text/javascript" }));
            navigator.serviceWorker.register(swUrl).catch(function () {});
          }
        } catch (e) { /* 登録できない環境でも本体は動く */ }
      }

      /* ================= 初期化 ================= */
      function init() {
        var now = new Date();
        state.viewYear = now.getFullYear();
        state.viewMonth = now.getMonth() + 1;

        setupPWA();
        resetForm();

        $("signin-form").addEventListener("submit", function (ev) {
          ev.preventDefault();
          var errEl = $("signin-error");
          errEl.hidden = true;
          var btn = $("signin-btn");
          btn.disabled = true;
          btn.textContent = "サインイン中…";
          signIn($("si-email").value.trim(), $("si-password").value).then(function () {
            btn.disabled = false;
            btn.textContent = "サインイン";
            showApp();
            loadData();
          }).catch(function (err) {
            btn.disabled = false;
            btn.textContent = "サインイン";
            var msg = err && err.message ? err.message : "";
            if (/invalid login credentials/i.test(msg)) msg = "メールアドレスまたはパスワードが違います。";
            else if (/email not confirmed/i.test(msg)) msg = "メールアドレスの確認が完了していません。";
            errEl.textContent = "サインインできませんでした：" + msg;
            errEl.hidden = false;
          });
        });

        $("setpw-form").addEventListener("submit", function (ev) {
          ev.preventDefault();
          var errEl = $("setpw-error");
          errEl.hidden = true;
          var pw = $("setpw-password").value || "";
          var pw2 = $("setpw-confirm").value || "";
          if (pw.length < 6) {
            errEl.textContent = "パスワードは6文字以上で入力してください。";
            errEl.hidden = false;
            return;
          }
          if (pw !== pw2) {
            errEl.textContent = "確認用のパスワードが一致しません。もう一度入力してください。";
            errEl.hidden = false;
            return;
          }
          var btn = $("setpw-btn");
          btn.disabled = true;
          btn.textContent = "設定中…";
          updatePassword(pw).then(function () {
            btn.disabled = false;
            btn.textContent = "パスワードを設定する";
            $("setpw-form").reset();
            showApp();
            showAppOk("パスワードを設定しました。");
            loadData();
          }).catch(function (err) {
            // トークンが切れていたらリフレッシュして1回だけ再試行
            var msg = err && err.message ? err.message : "";
            if (/jwt|token|unauthor|expired|401/i.test(msg) && getRefresh()) {
              return refreshSession().then(function () {
                return updatePassword(pw);
              }).then(function () {
                btn.disabled = false;
                btn.textContent = "パスワードを設定する";
                $("setpw-form").reset();
                showApp();
                showAppOk("パスワードを設定しました。");
                loadData();
              }).catch(function (err2) {
                btn.disabled = false;
                btn.textContent = "パスワードを設定する";
                errEl.textContent = "パスワードを設定できませんでした：" + (err2 && err2.message ? err2.message : err2) + "　リンクの有効期限が切れている場合は、新しいメールから開き直してください。";
                errEl.hidden = false;
              });
            }
            btn.disabled = false;
            btn.textContent = "パスワードを設定する";
            if (/password/i.test(msg) && /weak|short|least|characters/i.test(msg)) {
              msg = "パスワードが弱すぎるか短すぎます。6文字以上の別のパスワードにしてください。";
            }
            errEl.textContent = "パスワードを設定できませんでした：" + msg;
            errEl.hidden = false;
          });
        });

        $("signout-btn").addEventListener("click", signOut);

        $("prev-month").addEventListener("click", function () {
          var d = new Date(state.viewYear, state.viewMonth - 2, 1);
          state.viewYear = d.getFullYear(); state.viewMonth = d.getMonth() + 1;
          render();
        });
        $("next-month").addEventListener("click", function () {
          var d = new Date(state.viewYear, state.viewMonth, 1);
          state.viewYear = d.getFullYear(); state.viewMonth = d.getMonth() + 1;
          render();
        });

        $("donut-expense").addEventListener("click", function () { state.donutKind = "expense"; renderDonut(currentMonthTxs()); });
        $("donut-income").addEventListener("click", function () { state.donutKind = "income"; renderDonut(currentMonthTxs()); });

        document.querySelectorAll(".kind-seg button").forEach(function (b) {
          b.addEventListener("click", function () { setFormKind(b.getAttribute("data-kind"), true); });
        });
        $("tx-form").addEventListener("submit", submitForm);
        $("tx-cancel").addEventListener("click", resetForm);

        $("del-cancel").addEventListener("click", closeDelete);
        $("del-ok").addEventListener("click", doDelete);
        $("delete-modal").addEventListener("click", function (ev) {
          if (ev.target === $("delete-modal")) closeDelete();
        });

        // 認証コールバック（招待 / パスワード再設定リンク）を最優先で処理
        var callbackResult = handleAuthCallback();
        if (callbackResult) {
          // "setpw" のときはパスワード設定画面を表示済み。
          // "error" のときはサインイン画面にエラーを表示済み。
          return;
        }

        // 既存セッションの復元
        if (getAccess() && getExpires() > Date.now() + 30 * 1000) {
          scheduleRefresh(getExpires());
          showApp();
          loadData();
        } else if (getRefresh()) {
          refreshSession().then(function () {
            showApp();
            loadData();
          }).catch(function () {
            clearSession();
            showSignin();
          });
        } else {
          showSignin();
        }
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
